<rect x="893" y="394" width="74" height="26" rx="13" fill="#eef1f5"/>
<text x="905" y="411" font-size="12" font-weight="700" fill="#5b6472">2 of 3</text>
<rect x="867" y="804" width="96" height="34" rx="17" fill="#2ca02c"/>
<text x="885" y="826" font-size="14" font-weight="700" fill="#fff">Done &#10003;</text>
<rect x="1030" y="380" width="450" height="600" rx="14" fill="#ffffff" stroke="#e2e4e8" stroke-width="1.5"/><text x="1048" y="410" font-size="18" font-weight="700" fill="#1c2330">Step 3 - Connect to laptop</text>
