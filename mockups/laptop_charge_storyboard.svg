<text x="1344" y="772" font-size="12" fill="#2ca02c">&#10003; cable-laptop</text>
<rect x="1388" y="394" width="74" height="26" rx="13" fill="#eef1f5"/>
<text x="1400" y="411" font-size="12" font-weight="700" fill="#5b6472">3 of 3</text>
<rect x="1362" y="804" width="96" height="34" rx="17" fill="#2ca02c"/>
<text x="1380" y="826" font-size="14" font-weight="700" fill="#fff">Done &#10003;</text>
<text x="60" y="900" font-size="13" font-weight="700" fill="#5b6472">LEGEND</text>
<rect x="160" y="887" width="16" height="16" rx="3" fill="none" stroke="#ff7f0e" stroke-width="3"/>
<text x="184" y="900" font-size="13" fill="#3a4250">orange = take this part</text>
<rect x="430" y="887" width="16" height="16" rx="3" fill="none" stroke="#d62728" stroke-width="3"/>
<text x="454" y="900" font-size="13" fill="#3a4250">red ring = put it here</text>
<rect x="700" y="887" width="16" height="16" rx="3" fill="none" stroke="#999" stroke-width="3"/>
<text x="724" y="900" font-size="13" fill="#3a4250">dashed = ghost at target</text>
<rect x="970" y="887" width="16" height="16" rx="3" fill="none" stroke="#2ca02c" stroke-width="3"/>
<text x="994" y="900" font-size="13" fill="#3a4250">green = connection made</text>
