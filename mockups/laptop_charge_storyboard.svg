<text x="557" y="746" font-size="12" font-weight="700" fill="#5b6472">CONNECTIONS</text>
<rect x="557" y="752" width="132" height="30" rx="15" fill="#e7f6ec" stroke="#2ca02c"/>
<text x="569" y="772" font-size="12" fill="#2ca02c">&#10003; head-adapter</text>
<rect x="697" y="752" width="132" height="30" rx="15" fill="#e7f6ec" stroke="#2ca02c"/>
<text x="709" y="772" font-size="12" fill="#2ca02c">&#10003; adapter-strip</text>
