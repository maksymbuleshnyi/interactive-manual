<text x="214" y="772" font-size="12" fill="#9aa0a6">adapter-strip</text>
<rect x="342" y="752" width="132" height="30" rx="15" fill="#f1f2f4" stroke="#d4d7dc"/>
<text x="354" y="772" font-size="12" fill="#9aa0a6">cable-laptop</text>
<rect x="398" y="394" width="74" height="26" rx="13" fill="#eef1f5"/>
<text x="410" y="411" font-size="12" font-weight="700" fill="#5b6472">1 of 3</text>
<rect x="372" y="804" width="96" height="34" rx="17" fill="#2ca02c"/>
<text x="390" y="826" font-size="14" font-weight="700" fill="#fff">Done &#10003;</text>
<rect x="535" y="380" width="450" height="600" rx="14" fill="#ffffff" stroke="#e2e4e8" stroke-width="1.5"/><text x="553" y="410" font-size="18" font-weight="700" fill="#1c2330">Step 2 - Plug into outlet</text>
