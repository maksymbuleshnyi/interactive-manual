<text x="1052" y="746" font-size="12" font-weight="700" fill="#5b6472">CONNECTIONS</text>
<rect x="1052" y="752" width="132" height="30" rx="15" fill="#e7f6ec" stroke="#2ca02c"/>
<text x="1064" y="772" font-size="12" fill="#2ca02c">&#10003; head-adapter</text>
<rect x="1192" y="752" width="132" height="30" rx="15" fill="#e7f6ec" stroke="#2ca02c"/>
<text x="1204" y="772" font-size="12" fill="#2ca02c">&#10003; adapter-strip</text>
