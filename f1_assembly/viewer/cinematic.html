function noiseCanvas(S, fill){
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d'); x.fillStyle = fill; x.fillRect(0,0,S,S);
  return [c, x];
}
function woodTexture(S, reps){
  const [c, x] = noiseCanvas(S, '#6d4a2e');

    g.addColorStop(0,'rgba(120,74,40,0)');
    g.addColorStop(0.5,'rgba('+(90+Math.random()*70|0)+','+(55+Math.random()*40|0)+
                   ','+(28+Math.random()*24|0)+','+(0.05+Math.random()*0.09)+')');
    g.addColorStop(1,'rgba(120,74,40,0)');
    x.fillStyle = g; x.fillRect(0,0,S,S);
  }
  for (let i=0;i<3600;i++){
    const y0 = Math.random()*S, len = S*(0.25+Math.random()*0.85);
    const x0 = Math.random()*S - len*0.2;
    const dark = Math.random() < 0.55;
    x.strokeStyle = 'rgba('+(dark?'62,36,16':'196,150,104')+','+
                    (0.025+Math.random()*0.085)+')';
    x.lineWidth = 0.5 + Math.random()*2.4;
    x.beginPath(); x.moveTo(x0, y0);
    const amp = 1.5+Math.random()*3.5, ph = Math.random()*6.28;
    for (let t=0;t<=1.0001;t+=0.04)
      x.lineTo(x0+len*t, y0+Math.sin(ph+t*6.28*1.3)*amp);
    x.stroke();
  }
  for (let i=0;i<80;i++){
    const sx = Math.random()*S, sy = Math.random()*S;
    const len = 20+Math.random()*140, ang = (Math.random()-0.5)*0.9;
    x.strokeStyle = 'rgba('+(Math.random()<0.5?'232,214,190':'48,28,12')+','+
                    (0.05+Math.random()*0.13)+')';
    x.lineWidth = 0.5+Math.random()*1.1;
    x.beginPath(); x.moveTo(sx,sy);
    x.lineTo(sx+Math.cos(ang)*len, sy+Math.sin(ang)*len); x.stroke();
  }
  for (let i=0;i<10;i++){
    const sx=Math.random()*S, sy=Math.random()*S, r=6+Math.random()*22;
    const g2 = x.createRadialGradient(sx,sy,0,sx,sy,r);
    g2.addColorStop(0,'rgba(52,32,16,0.22)'); g2.addColorStop(1,'rgba(52,32,16,0)');
    x.fillStyle=g2; x.beginPath(); x.arc(sx,sy,r,0,6.29); x.fill();
  }
  x.strokeStyle='rgba(40,22,10,0.5)'; x.lineWidth=2.5;
  for (let i=1;i<4;i++){ x.beginPath(); x.moveTo(0,i*S/4); x.lineTo(S,i*S/4); x.stroke(); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(reps,reps); t.anisotropy = 8;
  return t;
}

// ---------------- the car ----------------
const FINISH = {
  matte: {roughness:0.72, metalness:0.02, clearcoat:0.10, cr:0.6},
  satin: {roughness:0.52, metalness:0.03, clearcoat:0.45, cr:0.35},
  gloss: {roughness:0.28, metalness:0.05, clearcoat:0.9,  cr:0.08},
  metal: {roughness:0.30, metalness:0.75, clearcoat:0.5,  cr:0.2},
};
let PAL = {body:'#2c2f34', accent:'#2c2f34', hub:'#40444b', tyre:'#131316',
           wood:'#6d4a2e', finish:'satin'};
function partMaterial(group, name){
  const f = FINISH[PAL.finish] || FINISH.satin;
  if (group === 'tyre')
    return new THREE.MeshPhysicalMaterial({color:new THREE.Color(PAL.tyre),
      roughness:0.95, sheen:0.35, sheenRoughness:0.9, sheenColor:0x2a2a30});
  if (group === 'hub')
    return new THREE.MeshPhysicalMaterial({color:new THREE.Color(PAL.hub),
      roughness:0.38, metalness:0.55, clearcoat:0.25});
  // wings, nose and fin wear the accent colour
  const isAccent = /Front Body|Rear Stabiliser Fin|Mini-Wing|Halo/.test(name||'');
  return new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(isAccent ? PAL.accent : PAL.body),
    roughness: f.roughness, metalness: f.metalness,
    clearcoat: f.clearcoat, clearcoatRoughness: f.cr});
}
function applyPalette(p){
  PAL = Object.assign({}, PAL, p);
  for (const n of names){
    const m = nodes[n] && nodes[n].g.children[0];
    if (m) m.material = partMaterial(PARTS[n].group, n);
  }
  woodMat.color = new THREE.Color(PAL.wood);
  woodEdge.color = new THREE.Color(PAL.wood).multiplyScalar(0.85);
}
const carGroup = new THREE.Group(); scene.add(carGroup);
const loader = new STLLoader();
const geoCache = {}, nodes = {};
let loaded = 0;
for (const n of names){
  const p = PARTS[n];
  const url = p.file.startsWith('f1_manual/') ? p.file.slice(10) : '../'+p.file;
  if (!geoCache[url]){
    const g = await loader.loadAsync(encodeURI(url));
    g.computeBoundingBox();
    const c = g.boundingBox.getCenter(new THREE.Vector3());
    g.translate(-c.x,-c.y,-c.z); g.computeVertexNormals();
    geoCache[url] = g;
  }
  const m = p.matrix;
  const M = new THREE.Matrix4();
  M.set(m[0][0],m[0][1],m[0][2],0, m[1][0],m[1][1],m[1][2],0,
        m[2][0],m[2][1],m[2][2],0, 0,0,0,1);
  const mesh = new THREE.Mesh(geoCache[url].clone(), partMaterial(p.group, n));
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.applyMatrix4(M);
  const g = new THREE.Group(); g.add(mesh); carGroup.add(g);
  nodes[n] = {g, pos:p.pos};
  hud.textContent = 'loading '+(++loaded)+'/'+names.length;
}

// ---------------- post processing ----------------
const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(W,H), 0.16, 0.7, 0.92);
composer.addPass(bloom);
const bokeh = new BokehPass(scene, cam, {focus: 400, aperture: 0.00022, maxblur: 0.006});
composer.addPass(bokeh);
const GradeShader = {
  uniforms: {tDiffuse:{value:null}, uTime:{value:0}, uVig:{value:0.34},
             uGrain:{value:0.045}, uWarm:{value:0.05}},
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime,uVig,uGrain,uWarm;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      // gentle film curve + warm highlights, cool shadows
      c = pow(c, vec3(0.98, 1.0, 1.03));
      c.r += uWarm * c.r * (1.0 - c.b);
      c.b += 0.03 * (1.0 - c.b) * (1.0 - c.r);
      // slight chromatic aberration toward the corners
      vec2 d = vUv - 0.5;
      float r2 = dot(d,d);
      c.r = texture2D(tDiffuse, vUv + d*0.0018*r2).r;
      c.b = texture2D(tDiffuse, vUv - d*0.0018*r2).b;
      // vignette
      c *= 1.0 - uVig * smoothstep(0.15, 0.85, r2*2.2);
      // grain
      float g = hash(vUv*vec2(1024.0,768.0) + uTime) - 0.5;
      c += g * uGrain;
      gl_FragColor = vec4(c, 1.0);
    }`
};
const grade = new ShaderPass(GradeShader);
composer.addPass(grade);
composer.addPass(new OutputPass());

// ---------------- timeline ----------------
// build stages: everything that adds parts, in manual order
const stages = [];
for (const st of man.steps){
  if (st.layout || !st.new || !st.new.length) continue;
  stages.push(st);
}
const HOLD = Math.max(6, Math.floor(NFRAMES * 0.62 / stages.length));
const BUILD_FRAMES = HOLD * stages.length;
const ease = t => t<0 ? 0 : t>1 ? 1 : 1-Math.pow(1-t,3);

function outboardGuard(n, d){
  if (!/Tyre|Wheel Hub|Inner Hub|Axle/.test(n)) return d;
  if (Math.abs(d[2]) <= Math.max(Math.abs(d[0]), Math.abs(d[1]))) return d;
  const z = PARTS[n].pos[2];
  return [0, 0, (Math.abs(z) > 8 ? z : 1) >= 0 ? 1 : -1];
}
function flyDir(n, joint){
  if (joint) return joint;
  const p = PARTS[n].pos;
  if (/Tyre|Wheel Hub|Inner Hub|Axle/.test(n)) return [0,0,Math.sign(p[2]||1)];
  if (/Pin|Back Body/.test(n)) return [-1,0.15,0];
  if (/Front Body|Mini-Wing/.test(n)) return [1,0.15,0];
  if (/Suspension/.test(n)) return [-0.8,0.1,0.5*Math.sign(p[2]||1)];
  return [0,1,0];
}
const jointAxis = {};
for (const st of stages)
  for (const k of (st.joints||[])){
    const j = GLUE[k]; if (!j) continue;
    const p = j.patches[0];
    jointAxis[j.a] = p.insert || p.normal;
  }

function setFrame(f){
  const t = f / NFRAMES;
  // which stage, and how far into it
  const sIdx = Math.min(stages.length-1, Math.floor(f / HOLD));
  const local = (f - sIdx*HOLD) / HOLD;
  const done = f >= BUILD_FRAMES;

  const shown = new Set();
  for (let k=0; k<=sIdx; k++) stages[k].new.forEach(n=>shown.add(n));
  if (done) names.forEach(n=>shown.add(n));

  let lo = 1e9;
  for (const n of names){
    const nd = nodes[n];
    nd.g.visible = shown.has(n);
    nd.g.position.set(...nd.pos);
    if (nd.g.visible) lo = Math.min(lo, nd.pos[1] - PARTS[n].dims[1]/2);
  }
  // the parts of this stage travel in along their real mating axis
  if (!done){
    const k = ease((local - 0.05) / 0.55);
    for (const n of stages[sIdx].new){
      const d = outboardGuard(n, flyDir(n, jointAxis[n]));
      const span = 62 * (1 - k);
      const p = nodes[n].pos;
      nodes[n].g.position.set(p[0]+d[0]*span, p[1]+d[1]*span, p[2]+d[2]*span);
    }
  }
  carGroup.position.y = (lo < 1e8) ? (TABLE_TOP - lo + 0.4) : 0;

  // camera: slow arc that tightens as the car comes together
  const az = 24 + 300*t;
  const el = 15 + 11*Math.sin(t*Math.PI);
  const zoom = 1.28 - 0.30*Math.sin(Math.min(1,t*1.15)*Math.PI*0.5);
  const target = new THREE.Vector3(0, carGroup.position.y + 4, 0);
  const r = 335 * zoom;
  const a = az*Math.PI/180, e = el*Math.PI/180;
  cam.position.set(target.x + r*Math.cos(e)*Math.sin(a),
                   target.y + r*Math.sin(e),
                   target.z + r*Math.cos(e)*Math.cos(a));
  cam.lookAt(target);
  key.target.position.copy(target);
  key.position.set(target.x+300, target.y+520, target.z+560);
  const sc = key.shadow.camera;
  sc.left=-260; sc.right=260; sc.top=260; sc.bottom=-260;
  sc.near=1; sc.far=1600; sc.updateProjectionMatrix();
  // keep focus on the car, open up the aperture for the hero pass
  bokeh.uniforms['focus'].value = cam.position.distanceTo(target);
  bokeh.uniforms['aperture'].value = done ? 0.00045 : 0.00022;
  grade.uniforms.uTime.value = f * 0.37;
}

// ---- deterministic randomisation of bench, room, light and layout ----
function mulberry32(a){
  return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const PAINTED = new THREE.MeshPhysicalMaterial({color:0x8d8d88, roughness:0.55,
  clearcoat:0.35, clearcoatRoughness:0.4});
const WALLS = ['#d3cbbd','#c9cdc6','#cdd4dc','#d8cfc6','#bfc4bd','#e0dbd2'];
function randomiseScene(rng, pal){
  // bench: real wood in a shifted tone, or a painted desk
  const painted = rng() < 0.28;
  const top = window.__tableTop;
  if (painted){
    PAINTED.color = new THREE.Color().setHSL(rng(), 0.05 + rng()*0.12,
                                             0.24 + rng()*0.5);
    top.material = [PAINTED,PAINTED,PAINTED,PAINTED,PAINTED,PAINTED];
  } else {
    const c = new THREE.Color(pal.wood);
    const hsl = {}; c.getHSL(hsl);
    woodMat.color = new THREE.Color().setHSL(
      (hsl.h + (rng()-0.5)*0.04 + 1) % 1,
      Math.min(0.9, hsl.s * (0.7 + rng()*0.7)),
      Math.min(0.8, hsl.l * (0.75 + rng()*0.7)));
    woodEdge.color = woodMat.color.clone().multiplyScalar(0.85);
    woodMat.roughness = 0.45 + rng()*0.35;
    top.material = [woodEdge,woodEdge,woodMat,woodEdge,woodEdge,woodEdge];
  }
  // wall
  window.__room.material.color = new THREE.Color(
    WALLS[(rng()*WALLS.length)|0]).multiplyScalar(0.85 + rng()*0.3);
  // light: window strength and warmth, key direction, exposure
  const warm = rng();
  window.__win.intensity = 2.1 + rng()*1.6;
  window.__win.color = new THREE.Color().setHSL(0.55 - warm*0.45, 0.12 + rng()*0.1,
                                                0.62 + rng()*0.1);
  window.__pane.material.color = window.__win.color.clone().lerp(
    new THREE.Color(0xffffff), 0.6);
  key.intensity = 2.4 + rng()*1.6;
  key.color = new THREE.Color().setHSL(0.09 - warm*0.05, 0.10 + rng()*0.12, 0.62);
  const ka = (rng()*2 - 1) * 0.9;
  key.position.set(Math.sin(ka)*640, 380 + rng()*320, Math.cos(ka)*640);
  renderer.toneMappingExposure = 0.97 + rng()*0.22;
  grade.uniforms.uGrain.value = 0.028 + rng()*0.035;
  grade.uniforms.uVig.value = 0.22 + rng()*0.22;
}
// scatter the not-yet-fitted parts the way they really end up on a bench
function scatterLoose(pending, rng, keepOut){
  const placed = [];
  for (const n of pending){
    const d = PARTS[n].dims;
    const rad = Math.max(d[0], d[2]) * 0.55 + 10;
    let px = 0, pz = 0, ok = false;
    for (let tries=0; tries<80 && !ok; tries++){
      px = (rng()*2 - 1) * 195;
      pz = 45 + rng() * 165;
      ok = !(px > keepOut.x0-rad && px < keepOut.x1+rad &&
             pz > keepOut.z0-rad && pz < keepOut.z1+rad);
      for (const q of placed)
        if (ok && Math.hypot(q.x-px, q.z-pz) < q.r + rad) ok = false;
    }
    placed.push({x:px, z:pz, r:rad});
    const nd = nodes[n];
    nd.g.visible = true;
    nd.g.rotation.y = rng() * Math.PI * 2;
    nd.g.position.set(px, d[1]/2 - carGroup.position.y, pz);
  }
}

// ---- batch mode: ?batch=1 renders every palette in every state ----
const BATCH = Q.get('batch') === '1';
if (BATCH){
  const cfg = await (await fetch('palettes.json')).json();
  const POSES = {           // az, el (distance is fitted to what is on the bench)
    loose:   [28, 44],
    body:    [32, 38],
    rolling: [34, 34],
  };
  // parts that are not yet fitted lie loose on the bench beside the build
  function looseLayout(pending){
    const sorted = [...pending].sort((a,b)=>
      Math.max(...PARTS[b].dims) - Math.max(...PARTS[a].dims));
    let gx = -200, gz = 120, rowH = 0;
    for (const n of sorted){
      const [dx,dy,dz] = PARTS[n].dims;
      const w = Math.max(dx,26) + 18;
      if (gx + w > 200){ gx = -200; gz += rowH + 22; rowH = 0; }
      nodes[n].g.visible = true;
      nodes[n].g.position.set(gx + w/2, dy/2 - carGroup.position.y,
                              gz + Math.max(dz,26)/2);
      gx += w; rowH = Math.max(rowH, Math.max(dz,26));
    }
  }
  const VARIANTS = parseInt(Q.get('variants') || '2');
  function setStage(upto){
    const fitted = new Set();
    if (upto >= 0)
      for (let k=0; k<=upto; k++)
        (man.steps[k].new || []).forEach(n => { if (!man.steps[k].layout) fitted.add(n); });
    let lo = 1e9;
    carGroup.rotation.y = 0; carGroup.position.set(0, 0, 0);
    for (const n of names){
      const nd = nodes[n];
      nd.g.visible = fitted.has(n);
      nd.g.rotation.y = 0;
      nd.g.position.set(...nd.pos);
      if (nd.g.visible) lo = Math.min(lo, nd.pos[1] - PARTS[n].dims[1]/2);
    }
    carGroup.position.y = (lo < 1e8) ? (TABLE_TOP - lo + 0.4) : 0.4;
    return names.filter(n => !fitted.has(n));
  }
  let done = 0;
  const TOTAL = cfg.palettes.length * cfg.states.length * VARIANTS;
  for (const pal of cfg.palettes){
    applyPalette(pal);
    for (const st of cfg.states){
     for (let v=0; v<VARIANTS; v++){
      const rng = mulberry32(pal.id.length*7919 + st.id.length*104729 + v*7717
                             + pal.name.charCodeAt(0)*131 + st.id.charCodeAt(0));
      randomiseScene(rng, pal);
      const pending = setStage(st.upto);
      // the build itself sits wherever it was left, at a random angle
      carGroup.rotation.y = (rng()*2 - 1) * 0.5;
      carGroup.position.x = (rng()*2 - 1) * 60;
      carGroup.position.z = (rng()*2 - 1) * 45;
      const half = st.upto < 0 ? 0 : 150;
      scatterLoose(pending, rng, {x0:carGroup.position.x-half,
                                  x1:carGroup.position.x+half,
                                  z0:carGroup.position.z-70,
                                  z1:carGroup.position.z+70});
      const [azB, elB] = POSES[st.id];
      const az = azB + (rng()*2 - 1) * 150;
      const el = Math.max(30, Math.min(58, elB + (rng()*2 - 1) * 12));
      // frame everything actually on the bench, assembly plus loose parts
      const bb = new THREE.Box3();
      for (const n of names){
        if (!nodes[n].g.visible) continue;
        const p = nodes[n].g.position, d = PARTS[n].dims;
        bb.expandByPoint(new THREE.Vector3(p.x-d[0]/2, 0, p.z-d[2]/2));
        bb.expandByPoint(new THREE.Vector3(p.x+d[0]/2, d[1], p.z+d[2]/2));
      }
      const c0 = bb.getCenter(new THREE.Vector3());
      const size = bb.getSize(new THREE.Vector3());
      const target = new THREE.Vector3(c0.x, carGroup.position.y + 6, c0.z);
      const fov = cam.fov * Math.PI/180;
      const span = Math.max(size.x, size.z * 1.25, 120);
      const r = (span * 0.5) / Math.tan(fov * 0.5) * (1.02 + rng()*0.2);
      const a = az*Math.PI/180, e = el*Math.PI/180;
      cam.position.set(target.x + r*Math.cos(e)*Math.sin(a),
                       target.y + r*Math.sin(e),
                       target.z + r*Math.cos(e)*Math.cos(a));
      cam.lookAt(target);
      key.target.position.copy(target);
      key.position.set(target.x+300, target.y+520, target.z+560);
      bokeh.uniforms['focus'].value = cam.position.distanceTo(target);
      bokeh.uniforms['aperture'].value = 0.00016;
      grade.uniforms.uTime.value = 7.0;
      composer.render();
      const blob = await new Promise(r2 => canvas.toBlob(r2, 'image/png'));
      await fetch('/frame?name=' + pal.id + '_' + st.id + '_v' + v,
                  {method:'POST', body:blob});
      hud.textContent = 'rendered ' + (++done) + '/' + TOTAL;
     }
    }
  }
  hud.textContent = 'BATCH DONE';
  document.title = 'BATCH DONE';
}
// ---- still mode: ?still=az,el,zoom[,grid] ----
const STILL = BATCH ? null : Q.get('still');
if (STILL){
  const [az, el, zoom, layout] = STILL.split(',');
  if (layout === 'grid'){
    const sorted = [...names].sort((a,b)=>
      Math.max(...PARTS[b].dims) - Math.max(...PARTS[a].dims));
    let gx = -210, gz = -150, rowH = 0;
    for (const n of sorted){
      const [dx,dy,dz] = PARTS[n].dims;
      const w = Math.max(dx,26) + 26;
      if (gx + w > 210){ gx = -210; gz += rowH + 32; rowH = 0; }
      nodes[n].g.visible = true;
      nodes[n].g.position.set(gx + w/2, dy/2, gz + Math.max(dz,26)/2);
      gx += w; rowH = Math.max(rowH, Math.max(dz,26));
    }
    carGroup.position.y = 0.4;
  } else {
    setFrame(NFRAMES);
  }
  const target = new THREE.Vector3(0, carGroup.position.y + 4, 0);
  const r = 335 * parseFloat(zoom), a = parseFloat(az)*Math.PI/180,
        e = parseFloat(el)*Math.PI/180;
  cam.position.set(target.x + r*Math.cos(e)*Math.sin(a),
                   target.y + r*Math.sin(e),
                   target.z + r*Math.cos(e)*Math.cos(a));
  cam.lookAt(target);
  key.target.position.copy(target);
  key.position.set(target.x+300, target.y+520, target.z+560);
  bokeh.uniforms['focus'].value = cam.position.distanceTo(target);
  bokeh.uniforms['aperture'].value = 0.00040;
  grade.uniforms.uTime.value = 11.0;
  composer.render();
  const blob = await new Promise(r2 => canvas.toBlob(r2, 'image/png'));
  await fetch('/frame?i=' + (Q.get('idx') || 0), {method:'POST', body:blob});
  hud.textContent = 'STILL DONE';
  document.title = 'STILL DONE';
} else if (!CAPTURE){
  let f = 0;
  (function loop(){
    setFrame(f % NFRAMES); f++;
    composer.render();
    hud.textContent = 'frame '+(f%NFRAMES)+'/'+NFRAMES;
    requestAnimationFrame(loop);
  })();
} else {
  hud.textContent = 'capturing…';
  for (let f=0; f<NFRAMES; f++){
    setFrame(f);
    composer.render();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    await fetch('/frame?i='+f, {method:'POST', body:blob});
    hud.textContent = 'captured '+(f+1)+'/'+NFRAMES;
  }
  hud.textContent = 'CAPTURE DONE';
  document.title = 'CAPTURE DONE';
}
</script></body></html>
